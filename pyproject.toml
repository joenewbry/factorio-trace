[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factorio-trace"
version = "0.1.0"
description = "Open dataset recorder for human Factorio play: screen, mouse, keys, plus an optional in-game mod sidecar."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Digital Surface Labs" }]
keywords = ["factorio", "dataset", "imitation-learning", "screen-recording"]
dependencies = [
  "pynput>=1.7.6",
  "mss>=9.0.1",
  "imageio-ffmpeg>=0.5.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
macos = [
  "pyobjc-framework-Cocoa>=10.0",
  "pyobjc-framework-Quartz>=10.0",
]
server = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.9",
]
dev = ["pytest>=8.0"]

[project.scripts]
factorio-trace = "factorio_trace.cli:main"

[project.urls]
Homepage = "https://factorio.digitalsurfacelabs.com"
Repository = "https://github.com/joenewbry/factorio-trace"

[tool.setuptools.packages.find]
include = ["factorio_trace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
